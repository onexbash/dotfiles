[startup]
tiled = true
daemon = true

[daemon]
keep_awake = "agents"  # don't let the Mac sleep while an agent works (display may still lock)
resume_agents = "auto" # after a daemon restart, resume each pane's conversation

[appearance]
theme = "onextheme"
glyphs = "default"      # default | unicode | heavy | ascii | <custom set>
confirm_quit = true
border_style = "glyphs" # rounded | normal | thick | double | block | outer-half-block | inner-half-block | ascii | hidden | glyphs
gap = 0
zoom_size = 100
nvim_navigation = true

# --  Borders  -- #
shared_borders = false
border_focused_color = "#cba6f7"
border_unfocused_color = "#45475a"
session_border = false             # session-color as border-color
session_colors = true              # border-color per session

[appearance.sidebar]
position = "right"
sections = "sessions, terminals, agents"

# --  Notifications  -- #
[notifications.agent]
enabled = true
notify = true
dock = true
sound = true
suppress_focused = true

[notifications.agent.states]
needs_input = true
errored = true
done = false

[notifications.mail]
between_agents = false # only alert on mail addressed to you

# --  Phone  -- #
# Push Inbox items to the phone, also with no client attached. Nothing is sent until a provider is set.
# After a change: run `tuios config apply` from a terminal OUTSIDE tuios, then `tuios notify test`.
[notify]
quiet_active_seconds = 120 # hold a push while you are typing at a client
# web_url = "https://..."  # only if you run tuios-web: the push then links to the Inbox item

[notify.triggers]
approval = true  # permission prompts held in the Inbox
plan = true      # plans waiting for approval
question = true  # an agent waiting on a question in its pane
ask = true       # tuios ask-human
mail = true      # mail to you; default is false
errored = true   # a pane that errored; default is false
finished = false # every finished turn: too noisy

# Pick one provider. TODO: Install the ntfy app, subscribe to a long random topic, keep the topic secret.
# [notify.ntfy]
# url = "https://ntfy.sh/<long-random-topic>"
# token_env = "NTFY_TOKEN"   # only for a protected topic or your own server; read from the daemon's environment
#
# [notify.pushover]
# user_env = "PUSHOVER_USER"
# token_env = "PUSHOVER_TOKEN"

# --  Agents  -- #
[agents]
silent_after = "20m" # a hooked agent with no report for this long shows as "no report"

# Hold Claude Code permission prompts in the Inbox (answer with keys, risky ones need a second press).
# Needs the waiting hook: run `tuios integration install claude-code` after changing this.
[agents.approvals]
enabled = ["claude-code"]
hold_seconds = 300        # max; default 120. Longer hold = time to answer from the phone before the prompt falls back to the pane

[agents.permissions]
mode = "strict"
grants = ["read", "write", "respond", "admin"]

# --  Keybindings  -- #
# Unbind defaults
[keybindings.gui]
terminal_focus_left = []
terminal_focus_right = []

# Globals
[keybindings.global]
toggle_zoom = ["alt+f"]
close_window = ["alt+q"]

# Layout Mode
[keybindings.layout]
toggle_tiling = ["t"]
# Alt+h/j/k/l are preselect keys by default; move them so focus can use them
preselect_left = ["alt+shift+h"]
preselect_down = ["alt+shift+j"]
preselect_up = ["alt+shift+k"]
preselect_right = ["alt+shift+l"]

# Terminal Mode
[keybindings.terminal_mode]
terminal_focus_left = ["alt+h"]
terminal_focus_down = ["alt+down", "alt+j"]
terminal_focus_up = ["alt+up", "alt+k"]
terminal_focus_right = ["alt+l"]

# Commands
[[keybindings.command]]
key = "alt+x"
type = "popup"
command = 'exec "${SHELL:-/bin/sh}"'
description = "Floating shell"
[[keybindings.command]]
key = "alt+left"
type = "shell"
command = "~/.config/tuios/scripts/workspaces.sh -1"
description = "Previous workspace"
[[keybindings.command]]
key = "alt+right"
type = "shell"
command = "~/.config/tuios/scripts/workspaces.sh +1"
description = "Next workspace"
[[keybindings.command]]
key = "alt+c"
type = "shell"
command = "~/.config/tuios/scripts/layout_coding.sh"
description = "Load Layout: coding"

[plugins]
enabled = ["worktrunk"]
