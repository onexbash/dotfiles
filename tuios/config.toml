[startup]
tiled = true
daemon = true

[appearance]
theme = "onextheme"
glyphs = "default"      # default | unicode | heavy | ascii | <custom set>
confirm_quit = true
border_style = "glyphs" # rounded | normal | thick | double | block | outer-half-block | inner-half-block | ascii | hidden | glyphs
gap = 0
zoom_size = 100
nvim_navigation = true

# --  Borders  -- #
shared_borders = false
border_focused_color = "#cba6f7"
border_unfocused_color = "#45475a"
session_border = false             # session-color as border-color
session_colors = true              # border-color per session

[appearance.sidebar]
position = "right"
sections = "sessions, terminals, agents"

# --  Notifications  -- #
[notifications.agent]
enabled = true
notify = true
dock = true
sound = true
suppress_focused = true

[notifications.agent.states]
needs_input = true
errored = true
done = true        # set false if "done" from the workers gets noisy

[notifications.mail]
between_agents = false # only alert on mail addressed to you

# --  Agents  -- #
# Hold Claude Code permission prompts in the Inbox (answer with keys, risky ones need a second press).
# Needs the waiting hook: run `tuios integration install claude-code` after changing this.
[agents.approvals]
enabled = ["claude-code"]


# --  Keybindings  -- #
# Unbind defaults
[keybindings.gui]
terminal_focus_left = []
terminal_focus_right = []

# Globals
[keybindings.global]
toggle_zoom = ["alt+f"]
close_window = ["alt+q"]

# Layout Mode
[keybindings.layout]
toggle_tiling = ["t"]
# Alt+h/j/k/l are preselect keys by default; move them so focus can use them
preselect_left = ["alt+shift+h"]
preselect_down = ["alt+shift+j"]
preselect_up = ["alt+shift+k"]
preselect_right = ["alt+shift+l"]

# Terminal Mode
[keybindings.terminal_mode]
terminal_focus_left = ["alt+h"]
terminal_focus_down = ["alt+down", "alt+j"]
terminal_focus_up = ["alt+up", "alt+k"]
terminal_focus_right = ["alt+l"]

# Commands
[[keybindings.command]]
key = "alt+x"
type = "popup"
command = 'exec "${SHELL:-/bin/sh}"'
description = "Floating shell"
[[keybindings.command]]
key = "alt+left"
type = "shell"
command = "~/.config/tuios/scripts/workspaces.sh -1"
description = "Previous workspace"
[[keybindings.command]]
key = "alt+right"
type = "shell"
command = "~/.config/tuios/scripts/workspaces.sh +1"
description = "Next workspace"
[[keybindings.command]]
key = "alt+c"
type = "shell"
command = "~/.config/tuios/scripts/layout_coding.sh"
description = "Load Layout: coding"

[plugins]
enabled = ["worktrunk"]
