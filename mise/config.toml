# --                                   -- #
# --   GLOBAL CONFIG - mise-en-place   -- #
# --                                   -- #

# Configs defined here are overridden if a project-wide mise.toml exists
# Usage: `mise install` & `mise doctor`

# -- |   TOOLS   |-- #
[tools]
ansible = "latest"
azure-functions-core-tools = "latest"
bun = "latest"
clang = "latest"
cmake = "latest"
dotnet = "latest"
fnox = "latest"
gitleaks = "latest"
go = "latest"
java = "latest"
julia = "latest"
lua = "latest"
maven = "latest"
mysql = "latest"
node = "lts"
npm = "latest"
"npm:typescript" = "latest"
opentofu = "latest"
osv-scanner = "latest"
perl = "latest"
php = "latest"
playwright = "latest"
pnpm = "latest"
postgres = "latest"
powershell = "latest"
python = { version = "latest", postinstall = "python -m pip install --upgrade playwright && python -m playwright install chromium" }
uv = "latest"
ruff = "latest"
redis = "latest"
ruby = "latest"
rust = "latest"
semgrep = "latest"
supabase = "latest"
svgo = "latest"
swift = "latest"
terraform = "latest"
tree-sitter = "latest"
trivy = "latest"
yarn = "latest"
zig = "latest"

# -- |   SETTINGS   | -- #
[settings]
activate_aggressive = true # Keep mise tools ahead of PATH entries
activate_shims = true # Add mise shims directories to PATH
auto_install = true # Auto Install missing tools
# env_shell_expand = false # never expand $VAR inside env values (secrets may contain '$')
idiomatic_version_file_enable_tools = [
  "node",
  "python",
] # Additionally read other config-files if a project has no mise.toml
minimum_release_age = "3d" # Ignore brand new tool releases (Supply-chain protection).
disable_backends = ["asdf", "spinel", "ubi"] # Disable Backends
jobs = 4 # Max Parallel install jobs
experimental = false # Experimental Features
# Auto-trust configs
trusted_config_paths = [
  "~/dev/repos/onexbash",
  "~/dev/repos/cratos",
  "~/.local/share/dotfiles",
]

# -- SETTINGS: self_update -- #
[settings.self_update]
auto = true                # Enable/Disable Auto-Updates
check_duration = "4h"      # frequency
minimum_release_age = "3d" # minimum age

# -- SETTINGS: tool_update -- #
[settings.tool_update]
global_auto = true
check_duration = "4h"

# -- SETTINGS: npm -- #
[settings.npm]
package_manager = "pnpm"

# -- SETTINGS: go -- #
[settings.go]
set_gobin = false # go install → $GOPATH/bin

# -- SETTINGS: node -- #
# [settings.node]
# cflags="" # CFLAGS for compiling node.js

# -- |   ENV   | -- #
[env]
GOPATH = "{{env.HOME}}/go"
