# --                                   -- #
# --   GLOBAL CONFIG - mise-en-place   -- #
# --                                   -- #

# Configs defined here are overridden if a project-wide mise.toml exists
# Usage: `mise install` & `mise doctor`

# -- TOOLS -- #
[tools]
ansible = "latest"
ansible-core = "latest"
# aqua = "latest"
ast-grep = "latest"
atuin = "latest"
aws-cli = "latest"
azure = "latest"
azure-functions-core-tools = "latest"
bat = "latest"
biome = "latest"
# black = "latest"
bun = "latest"
caddy = "latest"
clang = "latest"
claude = "latest"
cmake = "latest"
# codex = "latest"
direnv = "latest"
dotnet = "latest"
eza = "latest"
fd = "latest"
github-cli = "latest"
gitleaks = "latest"
go = "latest"

yazi = "latest"
podman = "latest"
pipx = "latest"
playwright = "latest"
gum = "latest"
java = "latest"


node = "lts"
pnpm = "latest"
python = { version = "latest", postinstall = "python -m pip install --upgrade playwright && python -m playwright install chromium" }
ruff = "latest"
ripgrep = "latest"
neovim = "latest"
lua = "latest"
ruby = "latest"
svgo = "latest"

# -- SETTINGS -- #
[settings]
activate_aggressive = true # Keep mise tools ahead of PATH entries
activate_shims = true # Add mise shims directories to PATH
auto_install = true # Auto Install missing tools
idiomatic_version_file_enable_tools = ["node", "python"] # Additionally read other config-files if a project has no mise.toml
minimum_release_age = "3d" # Ignore brand new tool releases (Supply-chain protection).
disable_backends = ["asdf", "spinel", "ubi"] # Disable Backends
jobs = 4 # Max Parallel install jobs
trusted_config_paths = ["~/dev/repos/onexbash", "~/dev/repos/cratos"] # Auto-trust configs
experimental = false # Experimental Features

# -- SETTINGS - self_update -- #
[settings.self_update]
auto = true # Enable/Disable Auto-Updates
check_duration = "4h" # frequency
minimum_release_age = "3d" # minimum age

# -- SETTINGS - tool_update -- #
[settings.tool_update]
global_auto = true
check_duration = "4h"


# -- SETTINGS - go -- #
[settings.go]
set_gobin = false # go install → $GOPATH/bin

# -- SETTINGS - node -- #
# [settings.node]
# cflags="" # CFLAGS for compiling node.js

# -- ENV -- #
[env]
GOPATH = "{{env.HOME}}/go"
