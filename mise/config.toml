# --                                   -- #
# --   GLOBAL CONFIG - mise-en-place   -- #
# --                                   -- #

# Configs defined here are overridden if a project-wide mise.toml exists
# Usage: `mise install` & `mise doctor`

# -- |   TOOLS   |-- #
[tools]
azure-functions-core-tools = "latest"
perl = "latest"
php = "latest"
powershell = "latest"
go = "latest"
java = "latest"
julia = "latest"
lua = "latest"
redis = "latest"
ruby = "latest"
rust = "latest"
supabase = "latest"
svgo = "latest"
swift = "latest"
tree-sitter = "latest"
zig = "latest"
# C / .NET
clang = "latest"
cmake = "latest"
dotnet = "latest"
# SQL
mysql = "latest"
maven = "latest"
postgres = "latest"
# Node
node = "lts"
npm = "latest"
pnpm = "latest"
bun = "latest"
yarn = "latest"
"npm:typescript" = "latest"
# Security
playwright = "latest"
osv-scanner = "latest"
fnox = "latest"
gitleaks = "latest"
semgrep = "latest"
trivy = "latest"
# Terraform
terraform = "latest"
opentofu = "latest"
# Python
python = { version = "3.15", postinstall = "mise sync python --uv" } # Global Interpreter; synced with uv
uv = "latest"
ruff = "latest"

# -- |   SETTINGS   | -- #
[settings]
activate_aggressive = true # Keep mise tools ahead of PATH entries
activate_shims = true # Add mise shims directories to PATH
auto_install = true # Auto Install missing tools
idiomatic_version_file_enable_tools = [
  "node",
] # Additionally read other config-files if a project has no mise.toml
disable_backends = ["asdf", "spinel", "ubi"] # Disable Backends
jobs = 4 # Max Parallel install jobs
experimental = false # Experimental Features
http_timeout = "90s" # Default: 30s
# Auto-trust configs
trusted_config_paths = [
  "~/dev/repos/onexbash",
  "~/dev/repos/cratos",
  "~/.local/share/dotfiles",
]

# -- SETTINGS: self_update -- #
[settings.self_update]
auto = true                # Enable/Disable Auto-Updates
check_duration = "4h"      # frequency

# -- SETTINGS: tool_update -- #
[settings.tool_update]
global_auto = true
check_duration = "4h"

# -- SETTINGS: npm -- #
[settings.npm]
package_manager = "pnpm"

# -- SETTINGS: go -- #
[settings.go]
set_gobin = false # go install → $GOPATH/bin

# -- SETTINGS: node -- #
# [settings.node]
# cflags="" # CFLAGS for compiling node.js

# -- SETTINGS: python -- #
[settings.python]
uv_venv_auto = "source" # TODO: check if it should be `source` or `create|source`

# -- |   ENV   | -- #
[env]
GOPATH = "{{env.HOME}}/go"
PIP_REQUIRE_VIRTUALENV = "true" # stops accidental installations outside a virtual environment


# -- |   TASKS   | -- #
[tasks.sync_python]
description = "Sync Python Installations between mise & uv"
alias = "pysync"
run = "mise sync python --uv"
